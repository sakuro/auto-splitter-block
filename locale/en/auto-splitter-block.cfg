[mod-name]
auto-splitter-block=Auto Splitter Block

[mod-description]
auto-splitter-block=Automatically sets splitter output filters to block the unused side when only one output has a transport entity.

[mod-setting-name]
auto-splitter-block-filter-item=Block filter item
auto-splitter-block-unhide-no-item=Make [item=no-item] __ITEM__no-item__ selectable in filter UIs
auto-splitter-block-enable-for-automated-builds=Enable for automated builds

[mod-setting-description]
auto-splitter-block-filter-item=The item to use as the splitter output filter for blocking. This item should never appear on belts.
auto-splitter-block-unhide-no-item=Unhides the base game's [item=no-item] __ITEM__no-item__ item so it can be selected manually in normal filter UIs (splitters, inserters, logistics requests, etc.). This affects every filter UI in the game, not just splitters.
auto-splitter-block-enable-for-automated-builds=Apply auto-blocking when entities are built by __ENTITY__construction-robot__ or __TECHNOLOGY__space-platform__. Disable this if blueprint-configured splitter filters are being overwritten.

[string-mod-setting]
auto-splitter-block-filter-item-no-item=[item=no-item] __ITEM__no-item__
auto-splitter-block-filter-item-deconstruction-planner=[item=deconstruction-planner] __ITEM__deconstruction-planner__
auto-splitter-block-filter-item-atan-null=[item=atan-null] __ITEM__atan-null__ (Null Item)
auto-splitter-block-filter-item-null=[item=null] __ENTITY__null__ (Null)

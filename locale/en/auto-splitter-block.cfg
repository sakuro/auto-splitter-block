[mod-name]
auto-splitter-block=Auto Splitter Block

[mod-description]
auto-splitter-block=Automatically sets splitter output filters to block the unused side when only one output has a transport entity.

[mod-setting-name]
auto-splitter-block-filter-item=Block filter item

[mod-setting-description]
auto-splitter-block-filter-item=The item to use as the splitter output filter for blocking. This item should never appear on belts.
